version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: naijacart-postgres
    environment:
      POSTGRES_USER: naijacart
      POSTGRES_PASSWORD: naijacart123
      POSTGRES_DB: naijacart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./portfolio-1-database-design/relational-schema.sql:/docker-entrypoint-initdb.d/relational-schema.sql

  mongodb:
    image: mongo:6
    container_name: naijacart-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
